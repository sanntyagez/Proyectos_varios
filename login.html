<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- <link rel="stylesheet" href="assets/styles/login.css"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('assets/images/login-background.jpeg') no-repeat center center fixed;
            background-size: cover;
        }
        .login-container {
            position: absolute;
            left: 51px;
            top: 48px;
            width: 448px;
            height: 600px;
            /* background: linear-gradient(to bottom, rgba(255,255,255,0.5) 0%,rgba(100,116,167,0) 100%); */
            background: rgba(51, 51, 51, 0.6);
            border: 3px solid #e9e9e9;
            border-radius: 10px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .login-title {
            font-family: 'Bebas Neue', sans-serif;
            color: #fff;
            font-size: 48px;
            letter-spacing: 8px;
            text-align: center;
            margin-bottom: 24px;
            margin-top: 0;
        }
        .login-logo {
            width: 214px;
            height: 214px;
            background: #eee;
            border-radius: 8px;
            margin-bottom: 24px;
            background: url('assets/icons/ISFD_logo.png') no-repeat center center;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .login-form {
            width: 100%;
            margin-bottom: 32px;
        }
        .login-form label {
            font-family: 'Roboto Mono', monospace;
            color: #fff;
            font-size: 18px;
            margin-bottom: 4px;
        }
        .login-form input {
            width: 100%;
            height: 40px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            margin-bottom: 16px;
            padding-left: 8px;
        }
        .login-form input::placeholder {
            color: #fff;
            opacity: 0.8;
        }
        .login-btn {
            width: auto;
            height: 45px;
            background: #fff;
            border: 3px solid #000;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #000;
            margin-top: 8px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #343434;
        }
        .login-footer {
            position: absolute;
            left: 0;
            bottom: 32px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .system-info {
            position: absolute; right: 51px; top: 48px; width: 448px; height: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .system-info img {
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 320px; 
            height: 320px; 
            object-fit: contain;
        }
        .system-info label {
            background-color: #343434;
            color: #fff; 
            font-family: 'Roboto Mono', monospace; 
            /* font-style:inherit ; */
            font-size: 28px; 
            font-weight: 600;
            margin-top: 24px; 
            text-align: center; 
            letter-spacing: 2px;
        }
    
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">INICIAR<br>SESIÓN</h1>
        <div class="login-logo"></div>
        <form class="login-form">
            <!-- <label for="email">Ingrese correo o DNI</label> -->
            <input type="text" id="email" name="email" placeholder="ingrese correo o dni" autocomplete="username">
            <!-- <label for="password">Ingrese contraseña</label> -->
            <input type="password" id="password" name="password" placeholder="ingrese contraseña" autocomplete="current-password">
            <button type="submit" class="login-btn">Entrar</button>
        </form>
    </div>
    <div class="system-info">
        <div>
            <img src="assets/icons/logo_sdl2.png" alt="SDL2 logo with stylized text, representing the digital records system. The logo is large and visually prominent, placed in a modern login page environment.">
            <label>
                Sistema de digitalización de legajos
            </label>
        </div>
    </div>
</body>
</html>
