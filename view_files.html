<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ver Archivos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* .table-container {
      margin-top: 30px;
    }
    .table th {
      background-color: #f8f9fa;
    }
    .icon-btn {
      border: none;
      background: none;
      cursor: pointer;
    }
    .icon-btn:hover {
      color: #0d6efd;
    } */
  </style>
</head>
<body class="bg-light">
  <!-- Reutiliza el header de main.html con una etiqueta <header> vacía o incluye mediante un fragmento/server-side include si es posible -->
  <header class="d-flex justify-content-between align-items-center bg-dark text-white py-3 px-4">
    <span class="rol-label">Rol: usuario</span>
      <button type="button" class="btn btn-dark" onclick="window.location.href='main.html'">
        <img src="https://img.icons8.com/ios-filled/ffffff/exit.png" alt="Volver a la página principal" title="Volver a la página principal" style="width:32px;height:32px;">
    </button>
  </header>

  <main class="container py-4">
    <h2 class="mb-4">📁 Página: Ver Archivos</h2>

    <!-- Filtros de busqueda de archivos -->
    <div class="row g-3">
      <div class="col-md-4">
        <input type="text" class="form-control" placeholder="🔍 Buscar por nombre de archivo">
      </div>
      <div class="col-md-4">
        <input type="text" class="form-control" placeholder="👤 Buscar por nombre de usuario">
      </div>
      <div class="col-md-4">
        <select class="form-select">
          <option selected>📄 Tipo de documento</option>
          <option value="ensayo">Ensayo</option>
          <option value="tesis">Tesis</option>
        </select>
      </div>
      <div class="col-md-4">
        <select class="form-select">
          <option selected>🎓 Disciplina o especialización</option>
          <option value="educacion">Educación</option>
          <option value="historia">Historia</option>
        </select>
      </div>
      <div class="col-md-4">
        <select class="form-select">
          <option selected>📅 Ordenar por fecha</option>
          <option value="reciente">Más reciente</option>
          <option value="antiguo">Más antiguo</option>
        </select>
      </div>
      <div class="col-md-4">
        <select class="form-select">
          <option selected>🔠 Ordenar por usuario</option>
          <option value="az">De la A a Z</option>
          <option value="za">De la Z a A</option>
        </select>
      </div>
    </div>

    <!-- Tabla -->
    <div class="table-container">
      <table class="table table-bordered table-hover mt-4">
        <thead class="table-light">
          <tr>
            <th>Nombre del archivo</th>
            <th>Especialización</th>
            <th>Usuario</th>
            <th>Tipo</th>
            <th>Entidad emisora</th>
            <th>Fecha de subida</th>
            <th>Acciones</th>
          </tr>
        </thead>
      </table>
    </div>
  </main>

</body>
