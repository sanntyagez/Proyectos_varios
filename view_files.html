<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ver archivos</title>
    <style>
        header {
            background: #2c3e50;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }
        td {
            padding: 8px;
        }
        .discardButton {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 16px;
        }
        .submitButton {
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <!-- Reutiliza el header de main.html con una etiqueta <header> vacía o incluye mediante un fragmento/server-side include si es posible -->
    <header>
            <button type="button" onclick="window.location.href='main.html'" style="background:none;border:none;cursor:pointer;color:#fff">
                <img src="https://img.icons8.com/ios-filled/ffffff/exit.png" alt="Volver a la página principal" title="Volver a la página principal" style="width:32px;height:32px;">
            </button>

        <!-- Puedes usar una etiqueta <header> vacía aquí y reutilizar el mismo contenido de main.html mediante un include si usas un motor de plantillas o JavaScript para cargar el header dinámicamente -->
    </header>
    <main>
        <h1>Página para ver archivos</h1>
        <table border="1" cellpadding="8" cellspacing="0" style="background: #fff; margin: 24px auto; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Nombre del Archivo</th>
                    <th>Tipo</th>
                    <th>Tamaño</th>
                    <th>Fecha de Modificación</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>documento1.wrd</td>
                    <td>Texto</td>
                    <td>15 KB</td>
                    <td>2024-06-01 10:30</td>
                </tr>
                <tr>
                    <td>imagen1.png</td>
                    <td>Imagen</td>
                    <td>250 KB</td>
                    <td>2024-06-02 14:20</td>
                </tr>
                <tr>
                    <td>presentacion.pdf</td>
                    <td>Presentación</td>
                    <td>1.2 MB</td>
                    <td>2024-06-03 09:15</td>
                </tr>
            </tbody>
    </main>
</body>
</html>
