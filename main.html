<body class="bg-light">
    <header class="d-flex justify-content-between align-items-center bg-dark text-white py-3 px-4">
        <span class="rol-label">Rol: usuario</span>
        <button class="salir-btn btn btn-danger">Salir</button>
        <script>
            document.querySelector('.salir-btn').addEventListener('click', function() {
                window.location.href = 'login.html';
            });
        </script>
    </header>
    <main class="d-flex justify-content-center gap-4 mt-5">
        <div class="card shadow text-center" style="width: 14rem; cursor:pointer;" onclick="location.href='upload.html'">
            <img src="https://img.icons8.com/ios-filled/100/upload.png" class="card-img-top mx-auto mt-3" alt="Subir archivos" style="width:64px;height:64px;">
            <div class="card-body">
                <h5 class="card-title">Subir archivos</h5>
            </div>
        </div>
        <div class="card shadow text-center" style="width: 14rem; cursor:pointer;" onclick="location.href='view_files.html'">
            <img src="https://img.icons8.com/ios-filled/100/view-file.png" class="card-img-top mx-auto mt-3" alt="Ver archivos" style="width:64px;height:64px;">
            <div class="card-body">
                <h5 class="card-title">Ver archivos</h5>
            </div>
        </div>
        <div class="card shadow text-center" style="width: 14rem; cursor:pointer;" onclick="location.href='view_applicants.html'">
            <img src="https://img.icons8.com/ios-filled/100/conference.png" class="card-img-top mx-auto mt-3" alt="Ver postulantes" style="width:64px;height:64px;">
            <div class="card-body">
                <h5 class="card-title">Ver postulantes</h5>
            </div>
        </div>
        <div class="card shadow text-center" style="width: 14rem; cursor:pointer;" onclick="location.href='admin_options.html'">
            <img src="https://img.icons8.com/ios-filled/100/settings.png" class="card-img-top mx-auto mt-3" alt="Opciones de administrador" style="width:64px;height:64px;">
            <div class="card-body">
                <h5 class="card-title">Opciones de administrador</h5>
            </div>
        </div>
    </main>
